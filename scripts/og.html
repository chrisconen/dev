<!doctype html>
<!-- Renders the 1200x630 Open Graph image. Regenerate with:
     node scripts/screenshots.mjs og
     Output: public/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Libre Caslon Text';
    src: url('../node_modules/@fontsource/libre-caslon-text/files/libre-caslon-text-latin-400-normal.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Libre Caslon Text';
    src: url('../node_modules/@fontsource/libre-caslon-text/files/libre-caslon-text-latin-400-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
    font-weight: 500; font-style: normal;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #f3f4ef;
    color: #1a1e1b;
    font-family: 'Libre Caslon Text', serif;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    padding: 64px 72px 0 72px;
    display: flex; flex-direction: column;
  }
  .rail {
    position: absolute; top: 0; bottom: 0; left: 220px;
    border-left: 4px double #9fb3a3;
  }
  .content { position: relative; padding-left: 196px; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #565e57; margin-bottom: 34px;
  }
  .kicker .sep { color: #9fb3a3; padding: 0 10px; }
  h1 { font-size: 112px; font-weight: 400; line-height: 1.04; letter-spacing: -0.005em; }
  h1 em { font-style: italic; color: #154732; }
  .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px; letter-spacing: 0.06em; color: #565e57;
    margin-top: 38px; max-width: 760px; line-height: 1.6;
  }
  .tape {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fbfbf7; border-top: 1px solid #ccd1c8;
    padding: 26px 72px 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #565e57; display: flex; gap: 40px;
  }
  .tape strong { color: #1e5c40; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="rail"></div>
    <div class="content">
      <div class="kicker">Chris Conen<span class="sep">/</span>chrisconen.dev</div>
      <h1>Proof over<br><em>promises.</em></h1>
      <div class="sub">AI agent accountability. Ed25519-signed receipts. Security, GRC and AI assurance.</div>
    </div>
    <div class="tape">
      <span>BUILD <strong>SIGNED</strong></span>
      <span>MANIFEST <strong>VERIFIABLE</strong></span>
      <span>AXR <strong>OPEN SOURCE</strong></span>
    </div>
  </div>
</body>
</html>
